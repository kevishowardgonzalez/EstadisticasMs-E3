name: CI/CD Pipeline - EP3 (Observabilidad y Gobernanza)

on:
  push:
    branches: ["develop", "main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 1. Pruebas y cobertura JaCoCo (IE3 / IE5)
  test-and-coverage:
    name: Pruebas y Cobertura JaCoCo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Ejecutar pruebas y verificar cobertura
        run: mvn -B -ntp clean verify

      - name: Subir reporte JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

  # 2. Analisis de seguridad Snyk (IE5 / IE6)
  security-scan:
    name: Escaneo de Seguridad Snyk
    runs-on: ubuntu-latest
    needs: test-and-coverage

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Compilar dependencias Maven
        run: mvn -B -ntp test-compile

      - name: Instalar Snyk CLI
        run: npm install -g snyk

      - name: Autenticar y escanear dependencias
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "ERROR: SNYK_TOKEN no esta configurado"
            exit 1
          fi

          snyk auth "$SNYK_TOKEN"

          snyk test \
            --org=kevishowardgonzalez \
            --severity-threshold=critical \
            --json-file-output=snyk-report.json

      - name: Subir reporte Snyk
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-security-report
          path: snyk-report.json
          if-no-files-found: ignore

  # 3. SonarCloud y Quality Gate (IE3 / IE5 / IE6)
  sonarcloud-analysis:
    name: Analisis SonarCloud
    runs-on: ubuntu-latest
    needs: [test-and-coverage, security-scan]

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Ejecutar pruebas y analisis SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn -B -ntp clean verify \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar \
            -Dsonar.organization=kevishowardgonzalez \
            -Dsonar.projectKey=kevishowardgonzalez_EstadisticasMs-Devops \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.qualitygate.wait=true

  # 4. Construccion y Validacion en Contenedor (Smoke Test)
  build-and-smoke-test:
    name: Construccion Docker y Smoke Test
    runs-on: ubuntu-latest
    needs: [test-and-coverage, security-scan, sonarcloud-analysis]

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Construir imagen Docker
        run: |
          docker build \
            -t estadisticas-ms:latest \
            -t estadisticas-ms:${{ github.sha }} .

      - name: Crear credenciales temporales seguras
        run: |
          {
            echo "SERVER_PORT=8082"
            echo "MYSQL_DATABASE=db_estadisticas"
            echo "MYSQL_USER=estadisticas_user"
            echo "MYSQL_PASSWORD=$(openssl rand -hex 16)"
            echo "MYSQL_ROOT_PASSWORD=$(openssl rand -hex 16)"
          } > .env

      - name: Validar configuracion Docker Compose
        run: docker compose config --quiet

      - name: Desplegar contenedores de prueba
        run: docker compose up -d --no-build

      - name: Verificar respuesta de la API (Smoke Test)
        run: |
          for intento in {1..30}; do
            codigo=$(curl -s -o /dev/null -w "%{http_code}" \
              http://localhost:8082/api/estadisticas || true)

            if [ "$codigo" = "200" ]; then
              echo "API funcionando correctamente: HTTP 200"
              exit 0
            fi

            echo "Esperando API (HTTP $codigo). Intento $intento/30..."
            sleep 3
          done

          echo "ERROR: La API no respondio correctamente"
          exit 1

      - name: Mostrar registros si hay errores
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=80

      - name: Detener contenedores de prueba
        if: always()
        run: docker compose down -v --remove-orphans

  # 5. Despliegue Orquestado en Kubernetes / EKS y Metricas CI/CD (IE2 / IE3)
  deploy-kubernetes:
    name: Despliegue Kubernetes (EKS) y Metricas
    runs-on: ubuntu-latest
    needs: [build-and-smoke-test]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Instalar kubectl
        uses: azure/setup-kubectl@v4

      - name: Validar sintaxis de manifiestos Kubernetes (k8s/)
        run: |
          if [ -d "k8s" ]; then
            kubectl apply --dry-run=client -f k8s/
          else
            echo "ADVERTENCIA: Carpeta k8s/ no encontrada"
            exit 1
          fi

      - name: Desplegar en Amazon EKS y medir tiempo de despliegue (IE2 / IE3)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_REGION: us-east-1
          EKS_CLUSTER_NAME: EstadisticasEKS
        run: |
          INICIO=$(date +%s)

          if [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "Conectando al cluster EKS: $EKS_CLUSTER_NAME..."
            aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"
            kubectl apply -f k8s/ -n estadisticas-ns
            kubectl rollout status deployment/estadisticas-ms -n estadisticas-ns --timeout=120s || true
            ESTADO_DESPLIEGUE="Despliegue aplicado en Amazon EKS ($EKS_CLUSTER_NAME)"
          else
            echo "Secretos de sesion temporal AWS Academy no activos; manifiestos validados en modo dry-run."
            ESTADO_DESPLIEGUE="Manifiestos k8s/ validados (entorno AWS Academy con sesion temporal)"
          fi

          FIN=$(date +%s)
          DURACION=$((FIN - INICIO))

          echo "### Resumen de Metricas de Despliegue (IE3)" >> $GITHUB_STEP_SUMMARY
          echo "- **Estado:** $ESTADO_DESPLIEGUE" >> $GITHUB_STEP_SUMMARY
          echo "- **Tiempo de despliegue:** ${DURACION}s" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY